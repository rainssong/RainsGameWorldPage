    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9ede5"/><stop offset="1" stop-color="#bddbd1"/></linearGradient>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.25"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#183b35" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#paper)"/>
  <circle cx="1080" cy="120" r="190" fill="#f7d8b2" opacity=".44"/>
  <circle cx="95" cy="820" r="175" fill="#b4d8ce" opacity=".5"/>

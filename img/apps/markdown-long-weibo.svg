<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Markdown2长微博产品展示图</title>
  <desc id="desc">Markdown 编辑器与长微博预览并排展示，并突出主题切换和导出长图功能。</desc>

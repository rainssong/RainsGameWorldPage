    <path d="M285 542c17 15 36 15 54 0" stroke="#bd667c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M136 386h31m-31 0v31m333-31h-31m31 0v31m-333 270h31m-31 0v-31m333 31h-31m31 0v-31" stroke="#fff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
    <rect x="629" y="250" width="492" height="535" rx="28" fill="#191e40" stroke="#494f7f" stroke-width="2"/>
    <rect x="665" y="284" width="60" height="60" rx="20" fill="#6352bf"/>
    <path d="M683 310h24m-20-8h16m-16 16h16" stroke="#dffbf3" stroke-width="3" stroke-linecap="round"/>

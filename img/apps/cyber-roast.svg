    <path d="M172 708c15-107 66-151 132-151s117 44 132 151" fill="#313455"/>
    <ellipse cx="304" cy="490" rx="88" ry="111" fill="#f3d0bd"/>
    <path d="M216 481c4-85 40-135 105-135 53 0 83 38 82 99-25-20-48-33-70-38-27 33-65 52-117 56Z" fill="#30304e"/>
    <path d="M240 482c16-9 31-9 45 0m39 0c14-9 29-9 44 0" stroke="#37304d" stroke-width="7" stroke-linecap="round"/>

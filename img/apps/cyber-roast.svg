<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">赛博留几手产品展示图</title>
  <desc id="desc">一张抽象照片卡片和 AI 对话气泡，表现上传照片后进行轻松吐槽的玩法。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a37"/><stop offset=".55" stop-color="#232253"/><stop offset="1" stop-color="#122e43"/></linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5b4a2"/><stop offset="1" stop-color="#c17da3"/></linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#342c66"/><stop offset="1" stop-color="#263b61"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#050716" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#night)"/>
  <circle cx="1008" cy="151" r="164" fill="#a95be2" opacity=".23" filter="url(#glow)"/>
  <circle cx="171" cy="730" r="180" fill="#3fe0d0" opacity=".18" filter="url(#glow)"/>
  <path d="M0 778 276 610l225 113 278-202 421 284v95H0Z" fill="#111d3e" opacity=".55"/>
  <text x="82" y="98" fill="#88f4df" font-size="16" font-weight="700" letter-spacing="4" font-family="Arial,sans-serif">A PHOTO ROAST EXPERIMENT</text>
  <text x="82" y="159" fill="#fff" font-size="42" font-weight="700" font-family="'Microsoft YaHei',sans-serif">赛博留几手</text>
  <text x="84" y="194" fill="#b9bddc" font-size="17" font-family="Arial,sans-serif">UPLOAD A PHOTO · LET THE AI SPEAK</text>

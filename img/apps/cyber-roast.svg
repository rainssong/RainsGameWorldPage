    <text x="750" y="621" fill="#9da8cf" font-size="14" font-family="'Microsoft YaHei',sans-serif">AI 正在斟酌措辞…</text>
    <rect x="665" y="683" width="420" height="56" rx="20" fill="#23294c" stroke="#42496d"/>
    <text x="693" y="718" fill="#737fa5" font-size="15" font-family="'Microsoft YaHei',sans-serif">发张照片，看看它会怎么说</text>
    <circle cx="1048" cy="711" r="20" fill="#53dcca"/><path d="m1041 711 6 6 10-13" stroke="#172444" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

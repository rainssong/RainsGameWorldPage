    <text x="716" y="458" fill="#91a0c8" font-size="13" font-family="'Microsoft YaHei',sans-serif">AI 吐槽结果将在这里出现。</text>
    <rect x="786" y="505" width="288" height="57" rx="19" fill="url(#bubble)" stroke="#7668c9"/>
    <text x="813" y="540" fill="#e7e2ff" font-size="16" font-family="'Microsoft YaHei',sans-serif">开始一次照片吐槽</text>

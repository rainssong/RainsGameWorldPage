    <rect x="107" y="277" width="391" height="56" rx="16" fill="#30365b"/>
    <circle cx="137" cy="305" r="7" fill="#ff8c97"/><circle cx="161" cy="305" r="7" fill="#ffc36d"/><circle cx="185" cy="305" r="7" fill="#73ebd4"/>
